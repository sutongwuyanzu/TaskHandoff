[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "taskhandoff"
version = "0.2.5"
description = "DeepSeek-friendly long-task project memory & cross-session handoff for coding agents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "sutongwuyanzu" }]
keywords = [
  "agent",
  "skill",
  "handoff",
  "deepseek",
  "memory",
  "coding-agent",
  "mcp",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/sutongwuyanzu/TaskHandoff"
Repository = "https://github.com/sutongwuyanzu/TaskHandoff"
Issues = "https://github.com/sutongwuyanzu/TaskHandoff/issues"

[project.scripts]
handoff = "taskhandoff.cli:main"
handoff-mcp = "taskhandoff.mcp_server:main"

[tool.setuptools.packages.find]
include = ["taskhandoff*"]

[tool.setuptools.package-data]
taskhandoff = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
